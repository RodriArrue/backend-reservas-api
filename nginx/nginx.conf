    # 3. Generar certificado: sudo certbot certonly --standalone -d tu-dominio.com
    # 4. Descomentar el bloque de abajo y reemplazar tu-dominio.com
    # 5. Reiniciar Nginx: docker compose -f docker-compose.production.yml restart nginx
