# ============================================
# Nginx — Reverse Proxy para Sistema de Reservas API
# ============================================

events {
    worker_connections 1024;
}

http {
    # ─── Configuración general ───
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ─── Logs ───
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ─── Compresión Gzip ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain application/json application/javascript text/css;

    # ─── Rate Limiting ───
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ─── Upstream (API Node.js) ───
    upstream api_backend {
        server api:3000;
    }

    # ─── Servidor HTTP ───
    server {
        listen 80;
        server_name _;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check de Nginx
        location /nginx-health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Proxy a la API
        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # Headers de proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # ─── Servidor HTTPS (descomentar cuando tengas dominio + SSL) ───
    # Para habilitar HTTPS con Let's Encrypt:
    # 1. Obtener un dominio y apuntarlo a la IP de EC2
